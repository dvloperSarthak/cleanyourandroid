<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glow-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38"/>
      <stop offset="100%" stop-color="#B3050E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E50914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="24" fill="url(#bg-grad)" stroke="#27272a" stroke-width="2"/>

  <!-- Subtle Dot Grid Accent (Nothing OS aesthetic) -->
  <g fill="#27272a" opacity="0.6">
    <circle cx="40" cy="40" r="1.5"/><circle cx="60" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="100" cy="40" r="1.5"/>
    <circle cx="40" cy="60" r="1.5"/><circle cx="60" cy="60" r="1.5"/><circle cx="80" cy="60" r="1.5"/><circle cx="100" cy="60" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/><circle cx="60" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="100" cy="80" r="1.5"/>
    <circle cx="700" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/><circle cx="740" cy="160" r="1.5"/><circle cx="760" cy="160" r="1.5"/>
    <circle cx="700" cy="180" r="1.5"/><circle cx="720" cy="180" r="1.5"/><circle cx="740" cy="180" r="1.5"/><circle cx="760" cy="180" r="1.5"/>
    <circle cx="700" cy="200" r="1.5"/><circle cx="720" cy="200" r="1.5"/><circle cx="740" cy="200" r="1.5"/><circle cx="760" cy="200" r="1.5"/>
  </g>

  <!-- Icon Container with Glowing Nothing Red Accent -->
  <g transform="translate(60, 48)">
    <rect width="144" height="144" rx="28" fill="#18181c" stroke="#2e2e34" stroke-width="2"/>
    <rect x="12" y="12" width="120" height="120" rx="20" fill="url(#glow-red)" filter="url(#shadow)"/>
    
    <!-- Stylized Android Head & Lightning Bolt -->
    <!-- Android Head Contour -->
    <path d="M 46 72 A 26 26 0 0 1 98 72 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="58" cy="60" r="3.2" fill="#B3050E"/>
    <circle cx="86" cy="60" r="3.2" fill="#B3050E"/>
    <!-- Antennas -->
    <line x1="52" y1="46" x2="45" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="92" y1="46" x2="99" y2="38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dynamic Lightning Cleaning Bolt -->
    <polygon points="76,64 62,88 74,88 68,112 86,84 74,84" fill="#ffffff"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(235, 102)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-1">
      Clean<tspan fill="#E50914">Your</tspan>Android
    </text>
    <!-- Tagline & Description -->
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#a1a1aa" letter-spacing="0.2">
      Android Debloating, Customization &amp; Device Studio
    </text>
    <!-- Badge Pill -->
    <g transform="translate(0, 56)">
      <rect width="150" height="26" rx="6" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="26" y="17" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="600" font-size="11" fill="#e4e4e7">
        NON-ROOT ADB
      </text>
    </g>
    <g transform="translate(162, 56)">
      <rect width="138" height="26" rx="6" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="600" font-size="11" fill="#e4e4e7">
        NOTHING OS VIBE
      </text>
    </g>
  </g>
</svg>
